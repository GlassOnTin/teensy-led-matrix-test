[env:teensy40]
platform = teensy
board = teensy40
framework = arduino
upload_protocol = teensy-cli
monitor_speed = 115200

lib_deps = 
    fastled/FastLED @ ^3.10.0

build_flags = 
    -D USB_SERIAL
    -D LAYOUT_US_ENGLISH
    -D FASTLED_ALLOW_INTERRUPTS=0
    -D FASTLED_INTERRUPT_RETRY_COUNT=1
    
; Optional: Uncomment if you want to use the Audio Shield features later
; lib_deps = 
;     Audio